<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Employee Attendance & Wage System</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f2f5f9;
    margin:0;
    padding:20px;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin:0 0 8px;
    font-size:24px;
}

.month{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-bottom:25px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.label{
    font-weight:bold;
}

.value{
    text-align:right;
}

h3{
    margin-top:25px;
}

.attendance{
    margin-top:10px;
}

.day{
    display:flex;
    justify-content:space-between;
    padding:9px 5px;
    border-bottom:1px solid #eee;
}

.loading{
    text-align:center;
    padding:30px;
}

.error{
    color:#c00;
    text-align:center;
    line-height:1.6;
    padding:20px;
}

</style>

</head>

<body>

<div class="card">

<h1>
Employee Attendance & Wage System
</h1>

<div class="month" id="month">
Loading month...
</div>

<div id="loading" class="loading">
Loading employee data...
</div>

<div id="error"
     class="error"
     style="display:none;">
</div>

<div id="data"
     style="display:none;">

<div class="row">
<span class="label">Employee</span>
<span class="value" id="name"></span>
</div>

<div class="row">
<span class="label">Daily Wage</span>
<span class="value">
₹<span id="wage"></span>
</span>
</div>

<div class="row">
<span class="label">Present Days</span>
<span class="value" id="present"></span>
</div>

<div class="row">
<span class="label">OT Hours</span>
<span class="value" id="ot"></span>
</div>

<div class="row">
<span class="label">OT Wages</span>
<span class="value">
₹<span id="otwage"></span>
</span>
</div>

<div class="row">
<span class="label">Monthly Wage</span>
<span class="value">
₹<span id="monthly"></span>
</span>
</div>

<h3>
Daily Attendance
</h3>

<div class="attendance"
     id="attendance">
</div>

</div>

</div>


<script>

/* =========================================
   GITHUB SETTINGS
========================================= */

const GITHUB_USER = "Vishal123456-oss";

const GITHUB_REPO = "September2026";

const API_URL =
"https://api.github.com/repos/" +
GITHUB_USER +
"/" +
GITHUB_REPO +
"/contents/";


/* =========================================
   EMPLOYEE ID
========================================= */

const params =
new URLSearchParams(window.location.search);

const employeeId =
Number(params.get("id"));


/* =========================================
   PAGE ELEMENTS
========================================= */

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const dataBox =
document.getElementById("data");

const monthBox =
document.getElementById("month");


/* =========================================
   ERROR
========================================= */

function showError(message){

    loading.style.display = "none";

    errorBox.style.display = "block";

    errorBox.innerHTML = "❌ " + message;

}


/* =========================================
   GET MONTH + YEAR
========================================= */

function getMonthInfo(fileName){

    const match =
    fileName.match(
        /^([A-Za-z]+)(\d{4})\.xlsx$/i
    );

    if(!match){

        throw new Error(
            "Excel filename must be like September2026.xlsx"
        );

    }

    const monthName =
    match[1];

    const year =
    Number(match[2]);


    const monthNames = {

        january:0,
        february:1,
        march:2,
        april:3,
        may:4,
        june:5,
        july:6,
        august:7,
        september:8,
        october:9,
        november:10,
        december:11

    };


    const monthNumber =
    monthNames[
        monthName.toLowerCase()
    ];


    if(monthNumber === undefined){

        throw new Error(
            "Invalid month in Excel filename."
        );

    }


    /*
       Calculate actual number of days.

       Example:

       September 2026
       = 30

       February 2028
       = 29
    */

    const daysInMonth =
    new Date(
        year,
        monthNumber + 1,
        0
    ).getDate();


    return {

        monthName:
        monthName.toUpperCase(),

        year:
        year,

        days:
        daysInMonth

    };

}


/* =========================================
   CHECK EMPLOYEE ID
========================================= */

if(!employeeId || employeeId < 1){

    showError(
        "Employee ID missing.<br><br>" +
        "Example:<br>" +
        "employee.html?id=1"
    );

}


/* =========================================
   LOAD GITHUB FILE LIST
========================================= */

else{

fetch(
    API_URL +
    "?v=" +
    Date.now()
)

.then(response => {

    if(!response.ok){

        throw new Error(
            "Could not access GitHub repository."
        );

    }

    return response.json();

})


/* =========================================
   FIND EXCEL FILE
========================================= */

.then(files => {

    const excelFiles =
    files.filter(file =>

        file.type === "file" &&
        file.name
        .toLowerCase()
        .endsWith(".xlsx")

    );


    if(excelFiles.length === 0){

        throw new Error(
            "No Excel (.xlsx) file found."
        );

    }


    /*
       Keep only ONE Excel file
       in repository.
    */

    const excelFile =
    excelFiles[0];


    /*
       Get month information
    */

    const monthInfo =
    getMonthInfo(
        excelFile.name
    );


    /*
       Show month and days
    */

    monthBox.innerText =
    "MONTH: " +
    monthInfo.monthName +
    " " +
    monthInfo.year;


    /*
       Download Excel
    */

    return fetch(
        excelFile.download_url +
        "?v=" +
        Date.now()
    )

    .then(response => {

        if(!response.ok){

            throw new Error(
                "Excel file could not be downloaded."
            );

        }

        return response.arrayBuffer();

    })

    .then(buffer => {

        return {

            buffer:
            buffer,

            monthInfo:
            monthInfo

        };

    });

})


/* =========================================
   OPEN EXCEL
========================================= */

.then(result => {

    const buffer =
    result.buffer;

    const monthInfo =
    result.monthInfo;


    const workbook =
    XLSX.read(
        buffer,
        {
            type:"array"
        }
    );


    /*
       Find Attendance sheet
    */

    let sheetName =
    workbook.SheetNames.find(
        name =>
        name
        .toLowerCase()
        .includes("attendance")
    );


    if(!sheetName){

        sheetName =
        workbook.SheetNames[0];

    }


    const sheet =
    workbook.Sheets[sheetName];


    if(!sheet){

        throw new Error(
            "Attendance sheet not found."
        );

    }


    /*
       Convert Excel to rows
    */

    const rows =
    XLSX.utils.sheet_to_json(
        sheet,
        {
            header:1,
            defval:""
        }
    );


    /*
       Employee ID 1 = Excel row 5
       Employee ID 2 = Excel row 6
       etc.
    */

    const rowIndex =
    employeeId + 3;


    const row =
    rows[rowIndex];


    if(!row || !row[0]){

        throw new Error(
            "Employee ID " +
            employeeId +
            " not found."
        );

    }


    /* =====================================
       EMPLOYEE INFORMATION
    ===================================== */

    const name =
    String(row[0]).trim();


    const wage =
    Number(row[1]) || 0;


    /* =====================================
       ACTUAL DAYS ONLY
    ===================================== */

    const totalDays =
    monthInfo.days;


    /*
       C = Excel index 2

       If September = 30 days:

       C:AF = 30 attendance cells

       AG = day 31 and is NOT read.
    */

    const attendance =
    row.slice(
        2,
        2 + totalDays
    );


    /* =====================================
       CALCULATE PRESENT DAYS
    ===================================== */

    let presentDays = 0;


    attendance.forEach(status => {

        status =
        String(status)
        .trim()
        .toUpperCase();


        if(
            status === "P" ||
            status.startsWith("P+")
        ){

            presentDays += 1;

        }


        else if(
            status === "H" ||
            status.startsWith("H+")
        ){

            presentDays += 0.5;

        }

    });


    /* =====================================
       CALCULATE OT HOURS
    ===================================== */

    let otHours = 0;


    attendance.forEach(status => {

        status =
        String(status)
        .trim()
        .toUpperCase();


        const match =
        status.match(
            /\+(\d+(?:\.\d+)?)/
        );


        if(match){

            otHours +=
            Number(match[1]);

        }

    });


    /* =====================================
       OT WAGE

       1 hour = Daily Wage / 8
    ===================================== */

    const otRate =
    wage / 8;


    const otWages =
    otHours * otRate;


    /* =====================================
       MONTHLY WAGE
    ===================================== */

    const monthlyWage =
    (presentDays * wage) +
    otWages;


    /* =====================================
       DISPLAY DATA
    ===================================== */

    document.getElementById("name")
    .textContent =
    name;


    document.getElementById("wage")
    .textContent =
    wage.toFixed(2);


    document.getElementById("present")
    .textContent =
    presentDays;


    document.getElementById("ot")
    .textContent =
    otHours;


    document.getElementById("otwage")
    .textContent =
    otWages.toFixed(2);


    document.getElementById("monthly")
    .textContent =
    monthlyWage.toFixed(2);


    /* =====================================
       DISPLAY ONLY ACTUAL DAYS
    ===================================== */

    const attendanceBox =
    document.getElementById(
        "attendance"
    );


    attendanceBox.innerHTML =
    "";


    attendance.forEach(
    (status,index) => {

        status =
        String(status).trim();


        const day =
        document.createElement(
            "div"
        );


        day.className =
        "day";


        day.innerHTML =
        "<span>Day " +
        (index + 1) +
        "</span>" +

        "<strong>" +
        (status || "-") +
        "</strong>";


        attendanceBox.appendChild(
            day
        );

    });


    /* =====================================
       SHOW PAGE
    ===================================== */

    loading.style.display =
    "none";


    dataBox.style.display =
    "block";

})


/* =========================================
   ERROR
========================================= */

.catch(error => {

    console.error(error);

    showError(
        error.message
    );

});

}

</script>

</body>

      </html>
