<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Employee Attendance & Wage System</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f2f5f9;
    margin:0;
    padding:20px;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin:0 0 8px;
    font-size:25px;
}

.month{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    margin-bottom:25px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.label{
    font-weight:bold;
}

.value{
    text-align:right;
}

.attendance{
    margin-top:20px;
}

.day{
    display:flex;
    justify-content:space-between;
    padding:9px 5px;
    border-bottom:1px solid #eee;
}

.loading{
    text-align:center;
    padding:30px;
}

.error{
    color:#c00;
    text-align:center;
    line-height:1.6;
}

</style>

</head>

<body>

<div class="card">

<h1>
Employee Attendance & Wage System
</h1>

<div class="month" id="month">
Loading month...
</div>

<div id="loading" class="loading">
Loading employee data...
</div>

<div id="error"
     class="error"
     style="display:none;">
</div>

<div id="data"
     style="display:none;">

<div class="row">
<span class="label">Employee</span>
<span class="value" id="name"></span>
</div>

<div class="row">
<span class="label">Daily Wage</span>
<span class="value">
₹<span id="wage"></span>
</span>
</div>

<div class="row">
<span class="label">Present Days</span>
<span class="value" id="present"></span>
</div>

<div class="row">
<span class="label">OT Hours</span>
<span class="value" id="ot"></span>
</div>

<div class="row">
<span class="label">OT Wages</span>
<span class="value">
₹<span id="otwage"></span>
</span>
</div>

<div class="row">
<span class="label">Monthly Wage</span>
<span class="value">
₹<span id="monthly"></span>
</span>
</div>

<h3>
Daily Attendance
</h3>

<div class="attendance"
     id="attendance">
</div>

</div>

</div>


<script>

/*
==================================================
AUTOMATIC EXCEL FILE DETECTION
==================================================
*/

const GITHUB_API =
"https://api.github.com/repos/" +
"vishal123456/September2026/contents/";


/*
IMPORTANT:

Your repository name is September2026.

If your GitHub username is different,
change ONLY the username below.
*/

const GITHUB_USER =
"vishal123456";

const GITHUB_REPO =
"September2026";


const API_URL =
"https://api.github.com/repos/" +
GITHUB_USER +
"/" +
GITHUB_REPO +
"/contents/";


/*
==================================================
GET EMPLOYEE ID
==================================================
*/

const params =
new URLSearchParams(
window.location.search
);

const employeeId =
Number(params.get("id"));


/*
==================================================
PAGE ELEMENTS
==================================================
*/

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const dataBox =
document.getElementById("data");

const monthBox =
document.getElementById("month");


/*
==================================================
ERROR
==================================================
*/

function showError(message){

    loading.style.display =
    "none";

    errorBox.style.display =
    "block";

    errorBox.innerHTML =
    "❌ " + message;
}


/*
==================================================
MONTH FROM EXCEL FILE NAME
==================================================
*/

function getMonthName(fileName){

    const match =
    fileName.match(
        /^([A-Za-z]+)(\d{4})\.xlsx$/i
    );

    if(!match){

        return fileName
        .replace(".xlsx","")
        .toUpperCase();

    }

    const month =
    match[1];

    const year =
    match[2];

    return (
        month.toUpperCase() +
        " " +
        year
    );
}


/*
==================================================
CHECK EMPLOYEE ID
==================================================
*/

if(!employeeId || employeeId < 1){

    showError(
        "Employee ID missing.<br><br>" +
        "Example:<br>" +
        "employee.html?id=1"
    );

}


/*
==================================================
FIND EXCEL FILE AUTOMATICALLY
==================================================
*/

else{

    fetch(API_URL)

    .then(response => {

        if(!response.ok){

            throw new Error(
                "Could not access GitHub repository."
            );

        }

        return response.json();

    })


    .then(files => {

        /*
        Find Excel files
        */

        const excelFiles =
        files.filter(file =>
            file.name
            .toLowerCase()
            .endsWith(".xlsx")
        );


        if(excelFiles.length === 0){

            throw new Error(
                "No Excel (.xlsx) file found."
            );

        }


        /*
        We use the first/only Excel file.
        Keep only ONE active Excel file
        in the repository.
        */

        const excelFile =
        excelFiles[0];


        const fileName =
        excelFile.name;


        /*
        Show month automatically
        */

        monthBox.innerText =
        "MONTH: " +
        getMonthName(fileName);


        /*
        Load Excel
        */

        return fetch(
            excelFile.download_url +
            "?v=" +
            Date.now()
        );

    })


    .then(response => {

        if(!response.ok){

            throw new Error(
                "Excel file could not be downloaded."
            );

        }

        return response.arrayBuffer();

    })


    .then(buffer => {

        /*
        Open Excel
        */

        const workbook =
        XLSX.read(
            buffer,
            {
                type:"array"
            }
        );


        /*
        Automatically find Attendance sheet.

        It looks for a sheet containing
        the word "Attendance".
        */

        let sheetName =
        workbook.SheetNames.find(
            name =>
            name
            .toLowerCase()
            .includes("attendance")
        );


        /*
        If no attendance sheet is found,
        use the first sheet.
        */

        if(!sheetName){

            sheetName =
            workbook.SheetNames[0];

        }


        const sheet =
        workbook.Sheets[sheetName];


        if(!sheet){

            throw new Error(
                "Attendance sheet not found."
            );

        }


        /*
        Convert Excel to rows
        */

        const rows =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header:1,
                defval:""
            }
        );


        /*
        Employee rows:

        Excel Row 5 = Employee ID 1
        Excel Row 6 = Employee ID 2
        Excel Row 7 = Employee ID 3

        Therefore:

        Array index =
        employee ID + 3
        */

        const rowIndex =
        employeeId + 3;


        const row =
        rows[rowIndex];


        if(!row || !row[0]){

            throw new Error(
                "Employee ID " +
                employeeId +
                " not found."
            );

        }


        /*
        ==========================================
        EMPLOYEE INFORMATION
        ==========================================
        */

        const name =
        String(row[0])
        .trim();


        const wage =
        Number(row[1]) || 0;


        /*
        ==========================================
        ATTENDANCE

        C:AG = 31 days
        ==========================================
        */

        const attendance =
        row.slice(2,33);


        /*
        ==========================================
        TOTALS

        AH = Present Days
        AI = OT Hours
        AJ = OT Wages
        AK = Monthly Wage
        ==========================================
        */

        let presentDays =
        Number(row[33]) || 0;


        let otHours =
        Number(row[34]) || 0;


        let otWages =
        Number(row[35]) || 0;


        let monthlyWage =
        Number(row[36]) || 0;


        /*
        ==========================================
        BACKUP CALCULATION
        ==========================================
        */

        if(!presentDays){

            presentDays = 0;

            attendance.forEach(
            status => {

                status =
                String(status)
                .trim()
                .toUpperCase();


                if(
                    status === "P" ||
                    status.startsWith("P+")
                ){

                    presentDays += 1;

                }


                else if(
                    status === "H" ||
                    status.startsWith("H+")
                ){

                    presentDays += 0.5;

                }

            });

        }


        if(!otHours){

            otHours = 0;

            attendance.forEach(
            status => {

                status =
                String(status)
                .trim()
                .toUpperCase();


                const match =
                status.match(
                    /\+(\d+(?:\.\d+)?)/
                );


                if(match){

                    otHours +=
                    Number(match[1]);

                }

            });

        }


        if(!otWages){

            otWages =
            otHours *
            (wage / 8);

        }


        if(!monthlyWage){

            monthlyWage =
            (presentDays * wage) +
            otWages;

        }


        /*
        ==========================================
        DISPLAY
        ==========================================
        */

        document.getElementById("name")
        .textContent =
        name;


        document.getElementById("wage")
        .textContent =
        wage.toFixed(2);


        document.getElementById("present")
        .textContent =
        presentDays;


        document.getElementById("ot")
        .textContent =
        otHours;


        document.getElementById("otwage")
        .textContent =
        otWages.toFixed(2);


        document.getElementById("monthly")
        .textContent =
        monthlyWage.toFixed(2);


        /*
        ==========================================
        DAILY ATTENDANCE
        ==========================================
        */

        const attendanceBox =
        document.getElementById(
            "attendance"
        );


        attendanceBox.innerHTML =
        "";


        attendance.forEach(
        (status,index) => {

            status =
            String(status)
            .trim();


            const day =
            document.createElement(
                "div"
            );


            day.className =
            "day";


            day.innerHTML =
            "<span>Day " +
            (index + 1) +
            "</span>" +

            "<strong>" +
            (status || "-") +
            "</strong>";


            attendanceBox.appendChild(
                day
            );

        });


        /*
        ==========================================
        SHOW PAGE
        ==========================================
        */

        loading.style.display =
        "none";


        dataBox.style.display =
        "block";

    })


    .catch(error => {

        console.error(error);

        showError(
            error.message
        );

    });

}

</script>

</body>
    </html>
