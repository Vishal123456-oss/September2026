<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Attendance & Wage System</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f5f9;
    margin:0;
    padding:20px;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin:0 0 8px;
    font-size:25px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.label{
    font-weight:bold;
}

.value{
    text-align:right;
}

.attendance{
    margin-top:20px;
}

.day{
    display:flex;
    justify-content:space-between;
    padding:9px 5px;
    border-bottom:1px solid #eee;
}

.loading{
    text-align:center;
    padding:30px;
}

.error{
    color:#c00;
    text-align:center;
    line-height:1.6;
}
</style>
</head>

<body>

<div class="card">

<h1>Employee Attendance & Wage System</h1>

<div class="subtitle">
Monthly Attendance & Salary Details
</div>

<div id="loading" class="loading">
Loading employee data...
</div>

<div id="error" class="error" style="display:none;"></div>

<div id="data" style="display:none;">

<div class="row">
<span class="label">Employee</span>
<span class="value" id="name"></span>
</div>

<div class="row">
<span class="label">Daily Wage</span>
<span class="value">₹<span id="wage"></span></span>
</div>

<div class="row">
<span class="label">Present Days</span>
<span class="value" id="present"></span>
</div>

<div class="row">
<span class="label">OT Hours</span>
<span class="value" id="ot"></span>
</div>

<div class="row">
<span class="label">OT Wages</span>
<span class="value">₹<span id="otwage"></span></span>
</div>

<div class="row">
<span class="label">Monthly Wage</span>
<span class="value">₹<span id="monthly"></span></span>
</div>

<h3>Daily Attendance</h3>

<div class="attendance" id="attendance"></div>

</div>
</div>

<script>

const EXCEL_FILE = "September2026.xlsx";
const SHEET_NAME = "September Attendance";

const params =
new URLSearchParams(window.location.search);

const employeeId =
Number(params.get("id"));

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const dataBox =
document.getElementById("data");


function showError(message){

    loading.style.display = "none";

    errorBox.style.display = "block";

    errorBox.innerHTML = message;
}


if(!employeeId || employeeId < 1){

    showError(
        "Employee ID missing.<br><br>" +
        "Example:<br>" +
        "employee.html?id=1"
    );

}
else{

    fetch(EXCEL_FILE + "?v=" + Date.now())

    .then(response => {

        if(!response.ok){

            throw new Error(
                "Excel file not found."
            );

        }

        return response.arrayBuffer();

    })

    .then(buffer => {

        const workbook =
        XLSX.read(buffer,{
            type:"array"
        });

        const sheet =
        workbook.Sheets[SHEET_NAME];

        if(!sheet){

            throw new Error(
                "Sheet '" +
                SHEET_NAME +
                "' not found."
            );

        }

        const rows =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header:1,
                defval:""
            }
        );


        /*
        Employee 1 = Excel row 5
        Employee 2 = Excel row 6
        Employee 3 = Excel row 7
        */

        const excelRowIndex =
        employeeId + 3;

        const row =
        rows[excelRowIndex];


        if(!row || !row[0]){

            throw new Error(
                "Employee not found for ID " +
                employeeId
            );

        }


        const name =
        String(row[0]).trim();

        const wage =
        Number(row[1]) || 0;


        /*
        C:AG = 31 attendance days
        */

        const attendance =
        row.slice(2,33);


        /*
        AH = Present Days
        AI = OT Hours
        AJ = OT Wages
        AK = Monthly Wage
        */

        let presentDays =
        Number(row[33]) || 0;

        let otHours =
        Number(row[34]) || 0;

        let otWages =
        Number(row[35]) || 0;

        let monthlyWage =
        Number(row[36]) || 0;


        /*
        Backup calculation
        */

        if(!presentDays){

            presentDays = 0;

            attendance.forEach(status => {

                status =
                String(status)
                .trim()
                .toUpperCase();

                if(status.startsWith("P")){
                    presentDays += 1;
                }

                else if(status.startsWith("H")){
                    presentDays += 0.5;
                }

            });

        }


        if(!otHours){

            otHours = 0;

            attendance.forEach(status => {

                status =
                String(status)
                .trim()
                .toUpperCase();

                const match =
                status.match(/\+(\d+)/);

                if(match){
                    otHours +=
                    Number(match[1]);
                }

            });

        }


        if(!otWages){

            otWages =
            otHours * (wage / 8);

        }


        if(!monthlyWage){

            monthlyWage =
            (presentDays * wage) +
            otWages;

        }


        /*
        Display employee data
        */

        document.getElementById("name")
        .textContent = name;

        document.getElementById("wage")
        .textContent =
        wage.toFixed(2);

        document.getElementById("present")
        .textContent =
        presentDays;

        document.getElementById("ot")
        .textContent =
        otHours;

        document.getElementById("otwage")
        .textContent =
        otWages.toFixed(2);

        document.getElementById("monthly")
        .textContent =
        monthlyWage.toFixed(2);


        /*
        Daily attendance
        */

        const attendanceBox =
        document.getElementById("attendance");

        attendanceBox.innerHTML = "";


        attendance.forEach((status,index) => {

            status =
            String(status).trim();

            const day =
            document.createElement("div");

            day.className = "day";

            day.innerHTML =
            "<span>Day " +
            (index + 1) +
            "</span>" +

            "<strong>" +
            (status || "-") +
            "</strong>";

            attendanceBox.appendChild(day);

        });


        loading.style.display =
        "none";

        dataBox.style.display =
        "block";

    })

    .catch(error => {

        showError(
            "Error loading data:<br><br>" +
            error.message
        );

    });

}

</script>

</body>
</html>
